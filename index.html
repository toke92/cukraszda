<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Godó Cukrászda – képek és élő rádió</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #17120e; color: #fff4dd; font-family: Arial, sans-serif; overflow: hidden; }
#picture { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
#panel { position: absolute; top: 18px; right: 18px; max-width: 540px; padding: 18px; background: #231b16; background: rgba(35,27,22,.96); border: 1px solid #b99b62; border-radius: 10px; }
#panel.hidden { display: none; }
h1 { font-family: Georgia, serif; margin: 0 0 12px; font-size: 26px; }
p { line-height: 1.5; margin: 10px 0; }
button, select { font: inherit; font-size: 18px; padding: 12px; margin: 5px 4px 5px 0; border: 2px solid #b99b62; border-radius: 5px; background: #352920; color: #fff4dd; }
button:focus, select:focus { outline: 3px solid #fff; background: #715534; }
#start { background: #d7b779; color: #231b16; }
#status { font-size: 17px; }
#diagnostics { display: none; max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: break-word; font-size: 13px; }
#menu { position: absolute; right: 14px; bottom: 12px; opacity: .6; font-size: 14px; padding: 8px; }
#image-error { position: absolute; left: 20px; bottom: 20px; background: #631d16; padding: 12px; display: none; }
</style>
</head>
<body>
<img id="picture" src="kepek/001.jpg" alt="Godó Cukrászda tortabemutató">
<audio id="radio" preload="none"></audio>
<button id="menu" type="button">Rádió / Menü</button>
<div id="panel">
  <h1>Godó Cukrászda</h1>
  <p>Tortabemutató és élő rádió</p>
  <label for="station">Rádióállomás</label><br>
  <select id="station">
    <option value="https://icast.connectmedia.hu/5202/live.mp3">Rádió 1</option>
    <option value="https://sunshine1.stream.composeit.hu/sunshine">Sunshine Rádió</option>
    <option value="https://youventusradio.hu/stream_192k">Juventus Rádió</option>
    <option value="https://danubiusradio.hu/live.mp3">Danubius Rádió</option>
    <option value="https://gamershouse.hu/livemega.mp3">MegaDance Rádió</option>
    <option value="https://icast.connectmedia.hu/5001/live.mp3">Retro Rádió</option>
    <option value="https://adas.dejavuradio.hu:8178/dejavuradio">Déjà Vu Rádió</option>
  </select><br>
  <button id="start" type="button">Indítás / Újrapróbálás</button>
  <button id="stop" type="button">Rádió leállítása</button>
  <button id="hide" type="button">Menü elrejtése</button>
  <p id="status" role="status">Az Indítás gombbal kapcsolható be a rádió.</p>
  <button id="debug" type="button">Hibakeresési adatok</button>
  <pre id="diagnostics"></pre>
</div>
<div id="image-error" role="alert"></div>
<script src="slides.js"></script>
<script src="player.js"></script>
</body>
</html>
